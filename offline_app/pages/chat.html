<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMAMIT Assistant</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="bar" id="bar"></header>

  <main class="chat">
    <!-- 0. Greeting: the robot waves when the app opens -->
    <section class="hero" id="hero">
      <div id="robotSlot"></div>
      <div class="greet">
        <p class="eyebrow">NMAMIT Campus Assistant</p>
        <h1 id="hello">Hello!</h1>
        <p id="sub">Ask me about timings, notices and timetables. Tap the microphone and speak.</p>
      </div>
    </section>

    <!-- 1. Waiting / recording -->
    <section id="idle" class="screen">
      <button id="mic" class="mic" aria-label="Tap to speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <path d="M12 17v5"/>
        </svg>
      </button>
      <p id="micHint" class="hint">Tap to speak</p>
      <p id="live" class="live" aria-live="polite">Everything runs on this laptop, no internet needed.</p>
    </section>

    <!-- 2. Processing -->
    <section id="processing" class="screen" hidden>
      <p id="pQuestion" class="question"></p>
      <ol class="steps" aria-live="polite">
        <li data-step="heard">Understanding your question</li>
        <li data-step="searching">Searching college information</li>
        <li data-step="thinking">Preparing the answer</li>
      </ol>
    </section>

    <!-- 3. Answer -->
    <section id="answer" class="screen" hidden>
      <p id="aQuestion" class="question"></p>
      <div class="card answer">
        <p id="aText"></p>
        <p id="aSources" class="muted small sources"></p>
      </div>
      <div class="row">
        <button id="replay" class="btn">Play again</button>
        <button id="stop" class="btn">Stop speaking</button>
        <button id="again" class="btn primary">Ask another</button>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <form id="typeForm" class="type-form">
      <input id="typeInput" maxlength="500" placeholder="Or type your question" aria-label="Type your question" autocomplete="off">
      <button class="btn">Ask</button>
    </form>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/offline/js/chat.js"></script>
</body>
</html>
