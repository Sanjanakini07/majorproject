<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face check · NMAMIT Assistant</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><span class="brand-mark">N</span>NMAMIT Assistant</a>
    <div class="bar-right"><a class="btn small ghost" href="/logout">Sign out</a></div>
  </header>
  <main class="page">
    <div class="card narrow centered">
      <h1 id="title">Face check</h1>
      <p id="lead" class="muted">Getting the camera ready…</p>
      <div id="scanner" class="scanner">
        <div class="lens"><video id="video" autoplay playsinline muted></video><div class="sweep"></div><div class="tick">✓</div></div>
      </div>
      <p id="instruction" class="instruction"></p>
      <div id="dots" class="dots"></div>
      <p id="status" class="status" role="status"></p>
      <ul id="tips" class="tips" hidden>
        <li>Sit in good light, with your face fully in the circle.</li>
        <li>Take off sunglasses and caps. Only you should be in view.</li>
        <li>Follow the prompts and move your head slowly.</li>
      </ul>
      <button id="go" class="btn primary block" hidden></button>
    </div>
  </main>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/facecam.js"></script>
  <script src="/static/js/face.js"></script>
</body>
</html>
